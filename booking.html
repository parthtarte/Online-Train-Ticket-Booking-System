<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Seat - RailEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-white">
    <div class="container py-5 d-flex align-items-center justify-content-center min-vh-100">
        <div class="col-lg-7 fade-in">
            <div class="bg-glass p-5 rounded-5 border-white/5 shadow-2xl">
                <div class="text-center mb-5">
                    <h2 class="fw-black mb-1">SELECT YOUR PREFERENCE</h2>
                    <p class="text-secondary small tracking-widest text-uppercase">Seat Reservation for {{ train.name }}</p>
                </div>

                <div class="train-info p-4 bg-black/40 rounded-4 border border-white/5 mb-5 d-flex justify-content-between align-items-center">
                    <div class="text-start">
                        <div class="small fw-bold text-orange text-uppercase tracking-wider opacity-75">Date of Travel</div>
                        <div class="h5 fw-black mb-0">{{ date }}</div>
                    </div>
                    <div class="text-end">
                        <div class="small fw-bold text-orange text-uppercase tracking-wider opacity-75">Base Fare</div>
                        <div class="h5 fw-black mb-0">₹{{ train.price|int }}</div>
                    </div>
                </div>
                
                <form action="/payment" method="POST">
                    <input type="hidden" name="train_id" value="{{ train.id }}">
                    <input type="hidden" name="date" value="{{ date }}">
                    
                    <div class="seating-area bg-black/20 p-5 rounded-4 border border-white/5 mb-5">
                        <div class="row g-3">
                            {% for i in range(1, 41) %}
                                {% set seat_name = 'S' ~ i %}
                                {% set is_booked = seat_name in booked_seats %}
                                <div class="col-3 col-sm-2">
                                    <input type="radio" class="btn-check" name="seat_no" id="seat{{i}}" value="{{seat_name}}" required {% if is_booked %}disabled{% endif %}>
                                    <label class="btn {% if is_booked %}btn-secondary opacity-25{% else %}btn-outline-orange{% endif %} w-100 py-3 fw-bold small rounded-3" for="seat{{i}}">{{ seat_name }}</label>
                                </div>
                            {% endfor %}
                        </div>
                        <div class="mt-4 pt-3 border-top border-white/5 d-flex justify-content-center gap-4">
                            <div class="d-flex align-items-center gap-2">
                                <span class="bg-orange p-1 rounded-circle"></span>
                                <small class="text-secondary small text-uppercase fw-bold">Available</small>
                            </div>
                            <div class="d-flex align-items-center gap-2 opacity-25">
                                <span class="bg-secondary p-1 rounded-circle"></span>
                                <small class="text-secondary small text-uppercase fw-bold">Occupied</small>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-orange w-100 py-4 fw-black text-uppercase shadow-2xl" style="font-size: 1.1rem; letter-spacing: 2px;">
                        Secure Transaction ➔
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <a href="javascript:history.back()" class="text-muted small text-decoration-none hover-orange">Cancel and Return</a>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
