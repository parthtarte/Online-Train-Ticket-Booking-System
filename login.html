<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RailEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-white">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="login-card p-5 rounded-5 bg-glass border border-secondary shadow-lg fade-in">
            <h2 class="fw-black mb-1">WELCOME BACK</h2>
            <p class="text-secondary mb-4">Access your RailEase dashboard.</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} py-2 px-3 small border-0 text-white mb-4">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="small fw-bold text-orange text-uppercase mb-2 d-block">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="mb-4">
                    <label class="small fw-bold text-orange text-uppercase mb-2 d-block">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-orange w-100 py-3 fw-bold text-uppercase">Signature Login</button>
            </form>
            <p class="mt-4 text-center text-secondary small">New to RailEase? <a href="/signup" class="text-orange text-decoration-none fw-bold">Sign Up</a></p>
            <div class="text-center mt-4">
                <a href="/" class="text-muted small text-decoration-none">← Back to Home</a>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
