<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailEase - Premium Train Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg navbar-dark bg-black/50 backdrop-blur-lg fixed-top py-3 border-bottom border-white/5">
        <div class="container">
            <a class="navbar-brand fw-black text-orange h2 mb-0" href="/">RAILEASE</a>
            <div class="navbar-nav ms-auto align-items-center">
                {% if current_user.is_authenticated %}
                    <a class="nav-link fw-bold me-3 text-white/80" href="/dashboard">Dashboard</a>
                    <a class="nav-link border border-white/20 rounded-pill px-4" href="/logout">Logout</a>
                {% else %}
                    <a class="nav-link fw-bold me-3 text-white/80" href="/login">Login</a>
                    <a class="nav-link border border-orange rounded-pill px-4 text-orange" href="/signup">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="hero-section min-vh-100 d-flex align-items-center pt-5">
        <div class="container fade-in">
            <div class="row justify-content-center">
                <div class="col-lg-10 text-center mb-5">
                    <h1 class="display-1 fw-black tracking-tight mb-4 hero-text">ULTIMATE RAIL<br>EXPERIENCES.</h1>
                    <p class="lead text-secondary opacity-75">Curated premium journeys across the Indian sub-continent.</p>
                </div>
                <div class="col-lg-11">
                    <div class="search-card p-5 rounded-5 bg-glass border border-white/10 shadow-2xl">
                        <form action="/search" method="GET" class="row g-4 pt-2">
                            <div class="col-md-4">
                                <label class="small fw-bold text-orange text-uppercase mb-3 tracking-widest">Boarding From</label>
                                <input type="text" name="from" class="form-control" placeholder="e.g. Mumbai" required>
                            </div>
                            <div class="col-md-4">
                                <label class="small fw-bold text-orange text-uppercase mb-3 tracking-widest">Destination</label>
                                <input type="text" name="to" class="form-control" placeholder="e.g. Delhi" required>
                            </div>
                            <div class="col-md-4">
                                <label class="small fw-bold text-orange text-uppercase mb-3 tracking-widest">Travel Date</label>
                                <input type="date" name="date" class="form-control" required>
                            </div>
                            <div class="col-12 mt-4 text-center">
                                <button type="submit" class="btn btn-orange px-5 py-3 fw-bold text-uppercase tracking-wider shadow-lg">Discover Trains</button>
                            </div>
                        </form>
                    </div>
                    
                    <div class="row mt-5 pt-4 text-center g-4 opacity-50">
                        <div class="col-md-4">
                            <h6 class="small fw-bold text-uppercase tracking-widest">Luxury Guaranteed</h6>
                        </div>
                        <div class="col-md-4">
                            <h6 class="small fw-bold text-uppercase tracking-widest">Secure Checkout</h6>
                        </div>
                        <div class="col-md-4">
                            <h6 class="small fw-bold text-uppercase tracking-widest">Priority Support</h6>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
